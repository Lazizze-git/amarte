# ==========================================================
#  Déploiement automatique vers l'hébergement cPanel
#  Chaque push sur `main` envoie le site par FTPS.
#
#  À configurer une seule fois dans GitHub :
#  dépôt → Settings → Secrets and variables → Actions
#
#    FTP_HOST      ex. ftp.amarte.ch
#    FTP_USER      l'utilisateur du compte FTP
#    FTP_PASSWORD  son mot de passe
#    FTP_DIR       dossier cible sur le serveur :
#                    /public_html/            → production
#                    /stag.amarte.ch/         → préproduction
#                  (avec un compte FTP limité à un dossier,
#                   c'est simplement /)
#
#  Ne sont pas envoyés : le dépôt Git, le studio Sanity, les
#  outils de publication, les guides internes (CMS, antispam) et
#  les fichiers de configuration du déploiement.
#
#  ⚠ `mirror --delete` supprime sur le serveur tout ce qui n'est
#    pas dans le dépôt. Le dossier de travail de l'antispam est
#    donc explicitement exclu : sans cette ligne, ses compteurs et
#    son journal seraient effacés à chaque mise en ligne.
# ==========================================================
name: Déployer sur cPanel

on:
  push:
    branches: [main]
  # Permet aussi de relancer un déploiement à la main depuis
  # l'onglet Actions, sans avoir à pousser un commit.
  workflow_dispatch:

concurrency:
  # Deux déploiements simultanés écriraient dans le même dossier.
  group: deploy-cpanel
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Sans cette étape, une page part avec la photo d'origine et
      # c'est le navigateur du visiteur qui interroge Sanity puis la
      # remplace : on voit l'ancienne photo une fraction de seconde,
      # et deux images sont téléchargées au lieu d'une. On interroge
      # donc Sanity une fois ici, et les pages partent avec la bonne
      # photo déjà dedans.
      #
      # Si Sanity ne répond pas, le script laisse les pages en l'état
      # et la publication continue : le site reste servi avec ses
      # photos d'origine, comme avant.
      - name: Écrire les photos de Sanity dans les pages
        run: node outils/photos-en-dur.mjs

      # Le CSS et le JS sont mis en cache une semaine par les
      # navigateurs et par Cloudflare. Sans estampille, un
      # déploiement laisse les visiteurs sur l'ancienne version.
      # L'empreinte du commit change à chaque envoi, donc l'adresse
      # du fichier change et le cache ne peut pas répondre à sa place.
      - name: Estampiller le CSS et le JS
        run: |
          EMPREINTE=$(git rev-parse --short HEAD)
          sed -i "s/?v=DEV/?v=$EMPREINTE/g" *.html
          echo "Estampille appliquée : $EMPREINTE"
          grep -o 'cms.js?v=[a-z0-9]*' index.html | head -1

      - name: Installer lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Envoyer les fichiers
        env:
          HOST: ${{ secrets.FTP_HOST }}
          USER: ${{ secrets.FTP_USER }}
          PASS: ${{ secrets.FTP_PASSWORD }}
          DIR:  ${{ secrets.FTP_DIR }}
        run: |
          lftp -c "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate no;
            open -u '$USER','$PASS' '$HOST';
            mirror --reverse --delete --verbose --parallel=4 \
              --exclude-glob .git/ \
              --exclude-glob antispam-donnees/ \
              --exclude-glob .github/ \
              --exclude-glob sanity/ \
              --exclude-glob outils/ \
              --exclude-glob .gitignore \
              --exclude-glob .cpanel.yml \
              --exclude-glob GUIDE-CMS.md \
              --exclude-glob ANTISPAM.md \
              . '$DIR';
          "
