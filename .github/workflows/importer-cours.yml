# ==========================================================
#  Synchronisation du contenu de reprise vers Sanity
#
#  Tourne automatiquement à chaque déploiement. L'import est
#  ADDITIF : il ne crée que les documents absents et ne touche
#  jamais à ce qui a été modifié dans le Studio. Le relancer est
#  donc sans conséquence.
#
#  Un lancement manuel permet, en dernier recours, de tout
#  réécrire depuis les fichiers du dépôt — en saisissant
#  REMPLACER, car cette opération efface le travail du client.
#
#  Secret requis :
#    SANITY_WRITE_TOKEN   jeton de rôle « Editor »
# ==========================================================
name: Synchroniser le contenu Sanity

on:
  push:
    branches: [main]
    paths:
      - 'sanity/**'
      - '.github/workflows/importer-cours.yml'
  workflow_dispatch:
    inputs:
      remplacer:
        description: 'Tapez REMPLACER pour écraser le contenu existant (sinon, import additif)'
        required: false
        default: ''

concurrency:
  group: sync-sanity
  cancel-in-progress: false

jobs:
  importer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sanity
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Synchroniser
        env:
          SANITY_WRITE_TOKEN: ${{ secrets.SANITY_WRITE_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.remplacer }}" = "REMPLACER" ]; then
            echo "Lancement en mode remplacement."
            node importer-cours.mjs --remplacer
          else
            node importer-cours.mjs
          fi
