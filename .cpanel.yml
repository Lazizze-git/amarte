---
# ==========================================================
#  Déploiement cPanel — Git™ Version Control
#  Copie le site dans la racine du domaine à chaque
#  « Deploy HEAD Commit » depuis cPanel.
#
#  ⚠ AVANT LE PREMIER DÉPLOIEMENT : vérifier DEPLOYPATH.
#    cPanel → Domaines → Sous-domaines → colonne « Racine du
#    document ». Le chemin doit se terminer par un « / ».
#
#    Préproduction : /home/amarte/stag.amarte.ch/
#    Production    : /home/amarte/public_html/
#
#  Ne sont PAS déployés : le dossier sanity/ (studio CMS, il
#  tourne chez Sanity, pas ici), GUIDE-CMS.md et le dépôt Git.
# ==========================================================
deployment:
  tasks:
    - export DEPLOYPATH=/home/amarte/stag.amarte.ch/
    - /bin/mkdir -p $DEPLOYPATH
    - /bin/cp -R css $DEPLOYPATH
    - /bin/cp -R js $DEPLOYPATH
    - /bin/cp -R public $DEPLOYPATH
    - /bin/cp -f index.html apropos.html calendrier.html contact.html $DEPLOYPATH
    - /bin/cp -f corpo.html cours.html location.html premiere-fois.html $DEPLOYPATH
    - /bin/cp -f tarifs.html $DEPLOYPATH
    - /bin/cp -f favicon.ico robots.txt sitemap.xml $DEPLOYPATH
    - /bin/cp -f .htaccess $DEPLOYPATH
